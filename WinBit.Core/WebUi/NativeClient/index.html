<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WinBit Web UI">
    <title>WinBit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230078D4'/><text x='8' y='12' text-anchor='middle' font-family='Segoe UI' font-weight='700' font-size='10' fill='white'>W</text></svg>">
</head>

<body>
    <header class="app-bar">
        <div class="brand">
            <span class="brand-badge">W</span>
            <span class="brand-text">WinBit</span>
            <span class="brand-sub" data-bind="status-line"></span>
        </div>
        <div class="app-actions" hidden data-role="signed-in">
            <button class="btn btn-accent" data-action="add">Add torrent</button>
            <button class="btn" data-action="toggle-alt">Alt-speed</button>
            <button class="btn btn-subtle" data-action="logout">Logout</button>
        </div>
    </header>

    <main class="app-main">
        <section class="card login" data-role="login">
            <h1>Sign in</h1>
            <p class="muted">Default credentials: <code>admin</code> / <code>adminadmin</code>.</p>
            <form data-form="login">
                <label>Username<input type="text" name="username" autocomplete="username" autofocus required></label>
                <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
                <button class="btn btn-accent" type="submit">Log in</button>
                <p class="error" data-bind="login-error" hidden></p>
            </form>
        </section>

        <section class="card" data-role="signed-in" hidden>
            <table class="torrent-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th class="num">Progress</th>
                        <th class="num">Size</th>
                        <th class="num">↓</th>
                        <th class="num">↑</th>
                        <th>State</th>
                        <th class="actions">Actions</th>
                    </tr>
                </thead>
                <tbody data-bind="torrents"></tbody>
            </table>
            <p class="muted empty" data-bind="empty" hidden>No torrents yet — click “Add torrent” to start.</p>
        </section>
    </main>

    <dialog data-dialog="add">
        <form method="dialog" data-form="add">
            <h2>Add torrent</h2>
            <label>URL or magnet link
                <textarea name="urls" rows="3" placeholder="magnet:?xt=urn:btih:..." required></textarea>
            </label>
            <label>Save path (optional, uses default when blank)
                <input type="text" name="savepath" placeholder="C:\Downloads">
            </label>
            <label class="inline">
                <input type="checkbox" name="paused"> Start paused
            </label>
            <menu class="dialog-actions">
                <button class="btn" type="button" data-action="cancel-add">Cancel</button>
                <button class="btn btn-accent" type="submit">Add</button>
            </menu>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>

</html>
