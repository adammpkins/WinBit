ShortDescription: A modern, beautiful, Windows-native BitTorrent client built on libtorrent.
Description: |-
  WinBit is a ground-up Windows 11 BitTorrent client built in C# and WinUI 3, aimed
  at feature parity with qBittorrent. The torrent engine wraps libtorrent-rasterbar
  through LibtorrentSharp (an in-repo .NET binding), and the UI uses Fluent Design —
  Mica backdrop, Segoe Fluent icons, dark/light theming, extended title bar.

  WinBit also ships an embedded Web UI (a native Vue SPA served by an in-process
  Kestrel host) that's qBittorrent v2 API-compatible, so existing third-party
  clients (Sonarr, Radarr, qbittorrent-api, etc.) work unchanged.
