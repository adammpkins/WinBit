name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v0.1.2)'
        required: true

permissions:
  contents: write
  id-token: write   # required for SignPath OIDC trusted-build verification

jobs:
  build-msix:
    name: Build MSIX and sign via SignPath
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              '${{ github.event.inputs.tag }}'
          } else {
              '${{ github.ref_name }}'
          }
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Tag=$tag Version=$version"

      - name: Verify Package.appxmanifest version matches tag
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content Package.appxmanifest)
          $manifestVersion = $manifest.Package.Identity.Version
          $expected = '${{ steps.tag.outputs.version }}'
          # Manifest is always 4-part (X.Y.Z.W); tag version may be 3-part — normalize
          $normalized = if (($expected -split '\.').Count -eq 3) { "$expected.0" } else { $expected }
          if ($manifestVersion -ne $normalized) {
              Write-Error "Package.appxmanifest Version='$manifestVersion' does not match tag '$expected' (normalized '$normalized'). Bump the manifest before tagging."
              exit 1
          }
          Write-Host "Manifest version matches tag: $manifestVersion"

      - name: Restore
        run: dotnet restore WinBit.slnx

      - name: Build solution
        run: dotnet build WinBit.slnx -c Release -p:Platform=x64 --no-restore

      - name: Run unit tests (smoke gate)
        run: dotnet test WinBit.Tests/WinBit.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # LibtorrentSharp tests are gated by ci.yml on push/PR. Don't repeat them
      # in the release workflow — the test host occasionally crashes mid-suite
      # on the windows-latest runner (tracked in TASKS.md), and a flaky test
      # shouldn't block a release whose CI already passed.

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          # AppxPackageSigningEnabled=false ⇒ MSBuild produces an unsigned .msix.
          # Signing is delegated to SignPath downstream so the cert + private key
          # never touch the runner. Restore happens implicitly because publish
          # needs win-x64 RID assets that the slnx-level restore may not have.
          dotnet publish WinBit.csproj -c Release -r win-x64 `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly

      - name: Locate unsigned MSIX
        id: unsigned
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -Filter '*.msix' -Path 'AppPackages' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch '\.appxsym|\.appxupload' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $msix) {
              Write-Error "No MSIX artifact found under AppPackages/"
              Get-ChildItem -Recurse -Filter '*.msix*' -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host $_.FullName }
              exit 1
          }
          # Stage under runner.temp with the final release filename so SignPath
          # round-trips the same name end-to-end.
          $stagedName = "WinBit-${{ steps.tag.outputs.tag }}-x64.msix"
          $stagedPath = Join-Path $env:RUNNER_TEMP $stagedName
          Copy-Item $msix.FullName $stagedPath
          Write-Host "Unsigned MSIX: $stagedPath ($($msix.Length) bytes)"
          "msix_path=$stagedPath"   | Out-File $env:GITHUB_OUTPUT -Append
          "msix_name=$stagedName"   | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload unsigned MSIX as workflow artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: WinBit-unsigned
          path: ${{ steps.unsigned.outputs.msix_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Submit MSIX to SignPath for signing
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 7d49de31-8b0f-4a88-94e0-4a66b6a6f2b6
          project-slug: winbit
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed

      - name: Locate signed MSIX
        id: signed
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "$env:RUNNER_TEMP/signed" -Filter '*.msix' -Recurse |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if (-not $signed) {
              Write-Error "SignPath returned no .msix in $env:RUNNER_TEMP/signed"
              Get-ChildItem -Recurse -Path "$env:RUNNER_TEMP/signed" |
                  ForEach-Object { Write-Host $_.FullName }
              exit 1
          }
          # Sanity: confirm the signature is real (chain may still terminate at
          # the SignPath test cert until Foundation approval, which is fine).
          $sig = Get-AuthenticodeSignature $signed.FullName
          Write-Host "SignerCertificate.Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Status: $($sig.Status)"
          if ($sig.Status -ne 'Valid' -and $sig.Status -ne 'UnknownError') {
              # 'UnknownError' is what Get-AuthenticodeSignature returns for an
              # MSIX whose chain root isn't in the local Trusted Root store —
              # expected with the SignPath test cert until Foundation lands.
              Write-Warning "Signature status is $($sig.Status); inspect manually"
          }
          $finalName = "WinBit-${{ steps.tag.outputs.tag }}-x64.msix"
          $finalPath = Join-Path $PWD $finalName
          Copy-Item $signed.FullName $finalPath -Force
          "msix_path=$finalPath" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Stage public test certificate (if committed)
        id: testcert
        shell: pwsh
        run: |
          # Until the SignPath Foundation cert is issued, releases are signed by
          # the SignPath test cert (still self-signed — chain terminates at
          # CN=Idiom Studio). End users must trust the cert before Add-AppxPackage
          # works. The public .cer lives at packaging/signpath-test.cer and is
          # downloaded by the maintainer from the SignPath dashboard.
          # When the Foundation cert lands, delete that .cer file and this step
          # becomes a no-op (publicly trusted certs need no manual trust).
          $src = Join-Path $PWD 'packaging/signpath-test.cer'
          if (Test-Path $src) {
              $dst = Join-Path $PWD "WinBit-${{ steps.tag.outputs.tag }}.cer"
              Copy-Item $src $dst
              "cer_path=$dst" | Out-File $env:GITHUB_OUTPUT -Append
              Write-Host "Test cert staged for release attachment: $dst"
          } else {
              Write-Host "No packaging/signpath-test.cer found — skipping cer attachment"
              "cer_path=" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: WinBit ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: ${{ startsWith(steps.tag.outputs.version, '0.') }}
          generate_release_notes: true
          body: |
            ## Install

            1. **Trust the signing cert** (one-time per machine, only needed until SignPath Foundation OSS cert is issued). Download `WinBit-${{ steps.tag.outputs.tag }}.cer`, then in an admin PowerShell:
               ```pwsh
               Import-Certificate -FilePath WinBit-${{ steps.tag.outputs.tag }}.cer -CertStoreLocation Cert:\LocalMachine\Root
               ```
            2. **Install the MSIX**: download `WinBit-${{ steps.tag.outputs.tag }}-x64.msix`, double-click, or:
               ```pwsh
               Add-AppxPackage WinBit-${{ steps.tag.outputs.tag }}-x64.msix
               ```

            ## Notes

            Built from tag `${{ steps.tag.outputs.tag }}`. Signed via SignPath. See the auto-generated changelog below.
          files: |
            ${{ steps.signed.outputs.msix_path }}
            ${{ steps.testcert.outputs.cer_path }}
