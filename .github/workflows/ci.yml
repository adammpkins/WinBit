name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore
        run: dotnet restore WinBit.slnx

      - name: Build
        run: dotnet build WinBit.slnx -c Release -p:Platform=x64 --no-restore

      - name: Run WinBit unit tests
        run: dotnet test WinBit.Tests/WinBit.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # LibtorrentSharp tests pass locally (288/288) but the test host crashes
      # intermittently on windows-latest, even with the Network category filtered
      # out and parallel execution disabled. Native libtorrent + the runner's
      # process model is destabilizing — needs separate triage. Run on demand
      # via workflow_dispatch instead of gating every push.
      - name: Run LibtorrentSharp tests (manual only — flake on windows-latest)
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test libtorrentsharp/LibtorrentSharp.Tests/LibtorrentSharp.Tests.csproj -c Release --no-build --filter "Category!=Network" --logger "console;verbosity=normal"
